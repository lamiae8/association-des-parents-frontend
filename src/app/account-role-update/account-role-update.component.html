<div class="m-4">
  <label for="searchEmail" class="block text-sm font-medium text-gray-700">Email:</label>
  <div class="mt-1 flex rounded-md shadow-sm">
    <input type="email" id="searchEmail" [(ngModel)]="searchEmail" name="searchEmail" class="focus:ring-indigo-500 focus:border-indigo-500 flex-1 block w-full rounded-none rounded-r-md sm:text-sm border-gray-300">
    <button (click)="getAdulteByEmail(searchEmail)" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Rechercher</button>
  </div>
</div>

<div *ngIf="adulte; else notFoundTemplate" class="m-4">
  <form (ngSubmit)="updateRole()" class="space-y-6">
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" id="email" [value]="adulte.mail" readonly class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
    </div>
    <div>
      <label for="role" class="block text-sm font-medium text-gray-700">Rôle</label>
      <select id="role" [(ngModel)]="adulte.role" name="role" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <option value="PARENT">Parent</option>
        <option value="ADMIN">Admin</option>
        <option value="PROFESSOR">Professeur</option>
      </select>
    </div>
    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Mettre à jour le rôle</button>
  </form>
</div>

<ng-template #notFoundTemplate>
  <p class="m-4 text-sm text-red-500">Le compte n'existe pas.</p>
</ng-template>
