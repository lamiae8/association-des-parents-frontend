<div class="flex justify-center items-center min-h-60">
  <div [hidden]="messageType === 'success'">
    <input type="email" id="email" placeholder="Adresse mail" class="border border-gray-300 px-4 py-2 rounded-lg">
    <button (click)="sendResetLink()" class="bg-blue-500 text-white px-4 py-2 rounded-lg ml-2">Envoyer le lien de réinitialisation</button>
  </div>
  <p [class]="messageType" class="mt-2">{{ message }}</p>
</div>
